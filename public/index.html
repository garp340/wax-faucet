<script>


/* ========================= */
/* CLAIM                     */
/* ========================= */

async function claim() {


    const input =
        document.getElementById('account');


    const button =
        document.getElementById('claimButton');


    const message =
        document.getElementById('message');


    const account =
        input.value.trim();


    if (!account) {


        message.className =
            'error';


        message.textContent =
            'Introduce tu cuenta WAX.';


        return;

    }


    button.disabled =
        true;


    message.className =
        'loading';


    message.textContent =
        'Enviando WAX...';


    try {


        const response =
            await fetch('/api/claim', {

                method:
                    'POST',

                headers: {

                    'Content-Type':
                        'application/json'

                },

                body:
                    JSON.stringify({

                        userAccount:
                            account

                    })

            });


        const data =
            await response.json();


        if (
            response.ok &&
            data.success
        ) {


            message.className =
                'success';


            message.innerHTML =

                '✅ Claim realizado correctamente.<br><br>' +

                'Has recibido ' +

                data.amount +

                '<br><br>' +

                '<a href="https://waxblock.io/transaction/' +

                encodeURIComponent(
                    data.transaction
                ) +

                '" target="_blank" rel="noopener noreferrer">' +

                'Ver transacción' +

                '</a>';


            input.value =
                '';


            /*
             * Recargar inmediatamente
             * los últimos claims
             */

            loadRecentClaims();


        } else {


            message.className =
                'error';


            message.textContent =

                data.error ||

                'No se pudo realizar el claim.';

        }


    } catch (error) {


        console.error(error);


        message.className =
            'error';


        message.textContent =
            'No se pudo conectar con el servidor.';

    }


    button.disabled =
        false;

}


/* ========================= */
/* ÚLTIMOS CLAIMS             */
/* ========================= */

async function loadRecentClaims() {


    const container =
        document.getElementById(
            'recentClaims'
        );


    try {


        const response =
            await fetch(
                '/api/recent-claims'
            );


        const data =
            await response.json();


        if (
            !data.success ||
            !data.claims ||
            data.claims.length === 0
        ) {


            container.innerHTML =

                '<div class="no-claims">' +

                'No hay claims todavía.' +

                '</div>';


            return;

        }


        container.innerHTML =

            data.claims
                .map(function(claim) {


                    return `

                        <div class="claim-row">

                            <div class="claim-account">

                                ${claim.account}

                            </div>
