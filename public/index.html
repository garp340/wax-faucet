<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Lo que aparece como título en Google -->
    <title>WaxFaucet</title>

    <!-- Descripción que Google puede mostrar -->
    <meta name="description" content="WAX network token faucet.">

    <!-- Logo/icono de tu web -->
    <link rel="icon" type="image/jpg" href="logowaxfaucet.jpg">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #1f2937;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .description {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background: #111827;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #f59e0b;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #f59e0b;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fbbf24;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            color: #34d399;
        }

        .error {
            color: #f87171;
        }

        .loading {
            color: #fbbf24;
        }

        a {
            color: #60a5fa;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>WAX Faucet</h1>

        <div class="amount">
            0.01000000 WAX
        </div>

        <div class="description">
            Introduce tu cuenta WAX para recibir WAX gratis.
        </div>

        <input
            id="account"
            type="text"
            placeholder="ejemplo.wam"
            autocomplete="off"
        >

        <button
            id="claimButton"
            onclick="claim()"
        >
            CLAIM WAX
        </button>

        <div id="message"></div>

    </div>

    <script>
        async function claim() {

            const input =
                document.getElementById('account');

            const button =
                document.getElementById('claimButton');

            const message =
                document.getElementById('message');

            const account =
                input.value.trim();

            if (!account) {

                message.className = 'error';

                message.textContent =
                    'Introduce tu cuenta WAX.';

                return;
            }

            button.disabled = true;

            message.className = 'loading';

            message.textContent =
                'Enviando WAX...';

            try {

                const response =
                    await fetch('/api/claim', {

                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            userAccount: account
                        })
                    });

                const data =
                    await response.json();

                if (response.ok && data.success) {

                    message.className = 'success';

                    message.innerHTML =
                        '✅ Claim realizado correctamente.<br><br>' +
                        'Has recibido ' +
                        data.amount +
                        '<br><br>' +
                        '<a href="https://waxblock.io/transaction/' +
                        encodeURIComponent(data.transaction) +
                        '" target="_blank" rel="noopener noreferrer">' +
                        'Ver transacción' +
                        '</a>';

                    input.value = '';

                } else {

                    message.className = 'error';

                    message.textContent =
                        data.error ||
                        'No se pudo realizar el claim.';
                }

            } catch (error) {

                console.error(error);

                message.className = 'error';

                message.textContent =
                    'No se pudo conectar con el servidor.';
            }

            button.disabled = false;
        }
    </script>

</body>
</html>
