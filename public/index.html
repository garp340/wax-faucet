<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WaxFaucet</title>

    <meta name="description" content="WAX network token faucet.">

    <link rel="icon" type="image/jpg" href="logowaxfaucet.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .page {
            width: 100%;
            max-width: 420px;
        }

        .ad-banner {
            width: 100%;
            min-height: 100px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-banner.bottom {
            margin: 20px auto 0;
        }

        .container {
            width: 100%;
            background: #1f2937;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .description {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background: #111827;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #f59e0b;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #f59e0b;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fbbf24;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            color: #34d399;
        }

        .error {
            color: #f87171;
        }

        .loading {
            color: #fbbf24;
        }

        a {
            color: #60a5fa;
        }

        /* ========================= */
        /* FOOTER                    */
        /* ========================= */

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-bottom: 10px;
            font-size: 14px;
        }

        /* Telegram - DIV separado */
        .telegram-footer {
            margin-bottom: 10px;
        }

        .telegram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .telegram-link:hover {
            color: #93c5fd;
        }

        .telegram-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Copyright - DIV separado */
        .copyright-footer {
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- ========================= -->
        <!-- BANNER A-ADS SUPERIOR     -->
        <!-- ========================= -->

        <div class="ad-banner">

            <!-- BEGIN AADS AD UNIT 2455670 -->

            <div id="frame-top"
                 style="width:320px;margin:auto;z-index:99998;height:auto">

                <iframe
                    data-aa="2455670"
                    src="//ad.a-ads.com/2455670/?size=320x100"
                    style="border:0;padding:0;width:320px;height:100px;overflow:hidden;display:block;margin:auto">
                </iframe>

            </div>

            <!-- END AADS AD UNIT 2455670 -->

        </div>


        <!-- ========================= -->
        <!-- CONTENIDO DEL FAUCET      -->
        <!-- ========================= -->

        <div class="container">

            <h1>WAX Faucet</h1>

            <div class="amount">
                0.01000000 WAX
            </div>

            <div class="description">
                Introduce tu cuenta WAX para recibir WAX gratis.
            </div>

            <input
                id="account"
                type="text"
                placeholder="ejemplo.wam"
                autocomplete="off"
            >

            <button
                id="claimButton"
                onclick="claim()"
            >
                CLAIM WAX
            </button>

            <div id="message"></div>

        </div>


        <!-- ========================= -->
        <!-- BANNER BETFURY INFERIOR   -->
        <!-- ========================= -->

        <div class="ad-banner bottom">

            <a
                href="https://bf1.io/?r=User9592889"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    src="https://bfstatic.io/pictures/Box/gif/320x100.gif"
                    alt="BetFury"
                    width="320"
                    height="100"
                    style="display:block;margin:auto;border:0;"
                >

            </a>

        </div>


        <!-- ========================= -->
        <!-- FOOTER                    -->
        <!-- ========================= -->

        <div class="footer">

            <!-- TELEGRAM - DIV 1 -->
            <div class="telegram-footer">

                <a
                    class="telegram-link"
                    href="https://t.me/waxfaucet"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Grupo de Telegram de WaxFaucet"
                >

                    <!-- Icono de Telegram -->
                    <svg
                        class="telegram-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21.5 3.5 18.3 20c-.24 1.17-.88 1.46-1.78.91l-4.88-3.6-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.98 9.07-8.19c.39-.35-.09-.55-.61-.2L5.91 13.8l-4.82-1.51c-1.05-.33-1.07-1.05.22-1.55L20.14 3.1c.87-.32 1.63.2 1.36.4Z"/>
                    </svg>

                    @waxfaucet

                </a>

            </div>


            <!-- COPYRIGHT - DIV 2 -->
            <div class="copyright-footer">
                © 2026 • waxfaucet
            </div>

        </div>

    </div>


    <script>
        async function claim() {

            const input =
                document.getElementById('account');

            const button =
                document.getElementById('claimButton');

            const message =
                document.getElementById('message');

            const account =
                input.value.trim();

            if (!account) {

                message.className = 'error';

                message.textContent =
                    'Introduce tu cuenta WAX.';

                return;
            }

            button.disabled = true;

            message.className = 'loading';

            message.textContent =
                'Enviando WAX...';

            try {

                const response =
                    await fetch('/api/claim', {

                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            userAccount: account
                        })
                    });

                const data =
                    await response.json();

                if (response.ok && data.success) {

                    message.className = 'success';

                    message.innerHTML =
                        '✅ Claim realizado correctamente.<br><br>' +
                        'Has recibido ' +
                        data.amount +
                        '<br><br>' +
                        '<a href="https://waxblock.io/transaction/' +
                        encodeURIComponent(data.transaction) +
                        '" target="_blank" rel="noopener noreferrer">' +
                        'Ver transacción' +
                        '</a>';

                    input.value = '';

                } else {

                    message.className = 'error';

                    message.textContent =
                        data.error ||
                        'No se pudo realizar el claim.';
                }

            } catch (error) {

                console.error(error);

                message.className = 'error';

                message.textContent =
                    'No se pudo conectar con el servidor.';
            }

            button.disabled = false;
        }
    </script>

</body>
</html>
