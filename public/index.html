<div class="card">

    <h1>WAX Faucet</h1>

    <div class="badge">
        0.01 WAX cada hora
    </div>

    <input
        type="text"
        id="userAccount"
        placeholder="Tu cuenta WAX (ej. abc12.wam)"
        autocomplete="off"
    >

    <button id="btn" onclick="claim()">
        Reclamar 0.01 WAX
    </button>

    <div id="status"></div>

</div>

<script>

    async function claim() {

        const accountInput = document.getElementById('userAccount');
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');

        const account = accountInput.value.trim();

        if (!account) {
            status.className = 'error';
            status.innerText = 'Ingresa tu cuenta WAX.';
            return;
        }

        btn.disabled = true;

        status.className = '';
        status.innerText = 'Enviando transacción...';

        try {

            const response = await fetch('/api/claim', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userAccount: account
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {

                status.className = 'success';

                status.innerHTML =
                    `¡Éxito! Has recibido ${data.amount}.<br><br>` +
                    `Transacción:<br>` +
                    `<a href="https://waxblock.io/transaction/${data.txId}" target="_blank" rel="noopener noreferrer">${data.txId}</a>`;

            } else {

                status.className = 'error';

                status.innerText =
                    data.error || 'Ha ocurrido un error.';

            }

        } catch (error) {

            console.error(error);

            status.className = 'error';

            status.innerText =
                'No se pudo conectar con el servidor.';

        } finally {

            btn.disabled = false;

        }
    }

</script>
